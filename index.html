<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte - GL</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; font: 13px/1.35 system-ui, sans-serif; }
  #panel { position: absolute; z-index: 1000; top: 10px; right: 10px; width: 290px; max-height: calc(100% - 50px);
    overflow-y: auto; background: #fffe; padding: 8px 10px; border-radius: 6px; box-shadow: 0 1px 6px #0004; }
  #panel h1 { font-size: 14px; margin: 0 0 4px; }
  #panel summary { font-weight: 600; cursor: pointer; margin: 6px 0 2px; }
  #panel label { display: block; }
  #panel small { display: block; color: #666; margin: 0 0 3px 20px; }
  #panel input[type=range] { width: 100%; height: 12px; margin: 0 0 2px; }
  .w { color: #c92a2a; cursor: help; font-style: normal; }
  #coords { position: absolute; z-index: 1000; bottom: 4px; left: 90px; background: #fffc; padding: 2px 6px; border-radius: 3px; font-size: 11px; }
  .drop { outline: 3px dashed #d9480f; outline-offset: -6px; }
  .leaflet-popup-content table { border-collapse: collapse; }
  .leaflet-popup-content th { text-align: left; padding-right: 8px; }
  #legend { position: absolute; z-index: 1000; bottom: 34px; left: 10px; width: 230px; max-height: 45%;
    overflow-y: auto; background: #fffe; padding: 6px 10px; border-radius: 6px; box-shadow: 0 1px 6px #0004; }
  #legend summary { font-weight: 600; cursor: pointer; }
  .le { margin: 6px 0 0; }
  .le img { max-width: 100%; display: block; margin-top: 2px; }
  .sw { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; }
  .grad { height: 10px; margin-top: 3px; border: 1px solid #999; background: linear-gradient(90deg, #000, #fff); }
  .gl { display: flex; justify-content: space-between; font-size: 11px; color: #555; }
  @media (max-width: 560px) { #legend { width: 150px; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel"></div>
<div id="legend"><details><summary>Légende</summary><div id="lgbody"></div></details></div>
<div id="coords"></div>
<script>
/* ============ CONFIGURATION ============ */
const GPF = 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM' +
            '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
// Couche WMTS de la Géoplateforme IGN (sans clé pour les données libres)
const ign = (layer, fmt = 'image/png', opt = {}) => ({
  url: GPF + '&LAYER=' + layer + '&FORMAT=' + fmt,
  opt: { maxNativeZoom: 18, maxZoom: 20, attribution: '© IGN', ...opt }
});

// Couches Patrinat/INPN : jeu de tuiles PM_6_16, disponibles uniquement entre les zooms 6 et 16
const patrinat = layer => {
  const d = ign(layer, 'image/png', { minZoom: 6, maxNativeZoom: 16, attribution: '© INPN / PatriNat' });
  d.url = d.url.replace('TILEMATRIXSET=PM', 'TILEMATRIXSET=PM_6_16');
  return d;
};

// Couche IGN dont le style ou le jeu de tuiles diffère de 'normal' / 'PM' (voir le GetCapabilities)
const ignCustom = (layer, style, tms, fmt, opt = {}) => {
  const d = ign(layer, fmt, opt);
  d.url = d.url.replace('STYLE=normal', 'STYLE=' + style).replace('TILEMATRIXSET=PM', 'TILEMATRIXSET=' + tms);
  return d;
};

const BASES = [
  { id: 'plan',  n: 'Plan IGN',                  ...ign('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2') },
  { id: 'ortho', n: 'Orthophoto IGN',            ...ign('ORTHOIMAGERY.ORTHOPHOTOS', 'image/jpeg', { maxNativeZoom: 19 }) },
  { id: 'irc',   n: 'Orthophoto IRC (infrarouge)', ...ign('ORTHOIMAGERY.ORTHOPHOTOS.IRC', 'image/jpeg') },
  { id: 'otm',   n: 'OpenTopoMap (monde)', url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    opt: { subdomains: 'abc', maxNativeZoom: 17, maxZoom: 20, attribution: '© OpenStreetMap, SRTM | © OpenTopoMap (CC-BY-SA)' } },
  { id: 'esri',  n: 'Imagerie Esri (monde)', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    opt: { maxNativeZoom: 19, maxZoom: 20, attribution: 'Esri, Maxar, Earthstar Geographics' } }
];

// on:1 = active au chargement ; op = opacité initiale ; d = description
const GROUPS = [
  { t: 'LiDAR HD IGN (France)', l: [
    { id: 'mnt', n: 'MNT LiDAR HD – ombrage', on: 1, op: 0.8, leg: 'gradient', d: 'Terrain nu (sol) : microreliefs, lobes, niches, ravines',
      ...ign('IGNF_LIDAR-HD_MNT_ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW') },
    { id: 'mns', n: 'MNS LiDAR HD – ombrage', op: 0.8, leg: 'gradient', d: 'Surface (canopée + bâti)',
      ...ign('IGNF_LIDAR-HD_MNS_ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW') },
    { id: 'mnh', n: 'MNH LiDAR HD – ombrage', op: 0.8, leg: 'gradient', d: 'Hauteur de végétation/bâti (MNS − MNT)',
      ...ign('IGNF_LIDAR-HD_MNH_ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW') }
  ]},
  { t: 'Topographie & pentes', l: [
    { id: 'slope', n: 'Pentes (RGE ALTI)', op: 0.6, d: 'Carte des pentes', ...ign('ELEVATION.SLOPES') },
    { id: 'slope30', n: 'Pentes > 30° (montagne)', op: 0.7, d: 'Zones de forte pente, utile aléas gravitaires', ...ign('GEOGRAPHICALGRIDSYSTEMS.SLOPES.MOUNTAIN') },
    { id: 'shade', n: 'Estompage IGN (BD Alti 25 m)', op: 0.6, leg: 'gradient', d: 'Ombrage de secours, résolution grossière (25 m)',
      ...ignCustom('ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW', 'estompage_grayscale', 'PM_0_15', 'image/png', { maxNativeZoom: 15 }) },
    { id: 'hill', n: 'Ombrage Esri (monde)', op: 0.6, leg: 'gradient', d: 'Hors France (ex. Andes) ; résolution limitée',
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}',
      opt: { maxNativeZoom: 16, maxZoom: 20, attribution: 'Esri' } }
  ]},
  { t: 'Hydrographie & géologie', l: [
    { id: 'hydro', n: 'Hydrographie (BD Topage)', d: 'Réseau hydrographique', ...ign('HYDROGRAPHY.HYDROGRAPHY') },
    { id: 'geol', n: 'Géologie BRGM (WMS)', op: 0.6, leg: 'https://geoservices.brgm.fr/geologie?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetLegendGraphic&FORMAT=image/png&LAYER=GEOLOGIE', d: 'Carte géologique harmonisée',
      wms: 'https://geoservices.brgm.fr/geologie', layers: 'GEOLOGIE', opt: { attribution: '© BRGM' } },
    { id: 'inpg', n: 'Patrimoine géologique (INPG)', op: 0.6, d: 'Sites géologiques inventoriés (dont géomorphologiques)', ...patrinat('Patrinat_INPG') },
    { id: 'apg', n: 'Aires de protection de géotope', op: 0.6, ...patrinat('Patrinat_APG') }
  ]},
  { t: 'Écologie & occupation du sol', l: [
    { id: 'foret', n: 'BD Forêt v2', op: 0.6, d: 'Types de formations végétales', ...ign('LANDCOVER.FORESTINVENTORY.V2') },
    { id: 'ocsge', n: 'OCS GE – couverture du sol', op: 0.6, d: 'Occupation du sol à grande échelle (couverture partielle)', ...ign('OCSGE.COUVERTURE') },
    { id: 'zn1', n: 'ZNIEFF type I', op: 0.6, ...patrinat('Patrinat_ZNIEFF1') },
    { id: 'zn2', n: 'ZNIEFF type II', op: 0.5, ...patrinat('Patrinat_ZNIEFF2') },
    { id: 'pnr', n: 'Parcs naturels régionaux', op: 0.5, ...patrinat('Patrinat_PNR') },
    { id: 'pprnr', n: 'Réserves nat. régionales – périmètres de protection', op: 0.5, d: 'Couverture limitée à une partie des Alpes', ...patrinat('Patrinat_PPNNR') },
    { id: 'sic', n: 'Natura 2000 – habitats (SIC)', op: 0.5, ...patrinat('Patrinat_SIC') },
    { id: 'zps', n: 'Natura 2000 – oiseaux (ZPS)', op: 0.5, ...patrinat('Patrinat_ZPS') },
    { id: 'pn', n: 'Parcs nationaux', op: 0.5, ...patrinat('Patrinat_PN') },
    { id: 'rnn', n: 'Réserves naturelles nationales', op: 0.5, ...patrinat('Patrinat_RNN') },
    { id: 'rnr', n: 'Réserves naturelles régionales', op: 0.5, ...patrinat('Patrinat_RNR') },
    { id: 'apb', n: 'Arrêtés de protection de biotope', op: 0.5, ...patrinat('Patrinat_APB') },
    { id: 'rb', n: 'Réserves biologiques', op: 0.5, ...patrinat('Patrinat_RB') },
    { id: 'ramsar', n: 'Zones humides Ramsar', op: 0.5, ...patrinat('Patrinat_RAMSAR') }
  ]},
  { t: 'Historique (évolution du paysage)', l: [
    { id: 'em', n: 'Carte d\'état-major (1820-1866)', op: 0.8, d: 'Occupation du sol ancienne', ...ign('GEOGRAPHICALGRIDSYSTEMS.ETATMAJOR40', 'image/jpeg', { maxNativeZoom: 15 }) },
    { id: 'ph50', n: 'Photographies aériennes 1950-1965', op: 0.9, d: 'Comparer avec l\'orthophoto actuelle', ...ign('ORTHOIMAGERY.ORTHOPHOTOS.1950-1965', 'image/png', { maxNativeZoom: 18 }) }
  ]},
  // Vos propres données : déposez vos .geojson (WGS84) dans le dépôt et listez-les ici
  { t: 'Mes données (GeoJSON du dépôt)', l: [
    // { id: 'rg', n: 'Glaciers rocheux', gj: 'data/glaciers_rocheux.geojson' }
  ]}
];

/* ============ CARTE ============ */
const map = L.map('map', { maxZoom: 20 }).setView([45.0, 6.4], 11);
L.control.scale({ metric: true, imperial: false }).addTo(map);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const gjStyle = { color: '#d9480f', weight: 2, fillOpacity: 0.2 };
const popup = (f, l) => {
  const p = f.properties || {};
  l.bindPopup('<table>' + Object.entries(p).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('') + '</table>');
};
const gjOpts = { style: gjStyle, onEachFeature: popup, bubblingMouseEvents: false };

// Signale une couche dont aucune tuile ne se charge (identifiant à vérifier ou zone non couverte)
function flag(d) {
  const el = document.getElementById('w-' + d.id);
  if (el) el.hidden = !(d.ko > 2 && d.ok === 0);
}
function build(d) {
  d.ok = 0; d.ko = 0;
  if (d.gj) {
    d.layer = L.geoJSON(null, gjOpts);
    d.layer.once('add', () => fetch(d.gj).then(r => r.json()).then(j => d.layer.addData(j)).catch(() => { d.ko = 3; flag(d); }));
    return d.layer;
  }
  d.layer = d.wms
    ? L.tileLayer.wms(d.wms, { layers: d.layers, format: 'image/png', transparent: true, maxZoom: 20, ...d.opt })
    : L.tileLayer(d.url, d.opt);
  d.layer.on('tileload', () => { d.ok++; flag(d); });
  d.layer.on('tileerror', () => { d.ko++; flag(d); });
  return d.layer;
}
BASES.forEach(build);
const OVERLAYS = GROUPS.flatMap(g => g.l);
OVERLAYS.forEach(build);

/* ============ ÉTAT (hash d'URL partageable) ============ */
const H = new URLSearchParams(location.hash.slice(1));
if (H.get('v')) { const [z, a, b] = H.get('v').split('/').map(Number); map.setView([a, b], z); }
const activeOv = H.has('l') ? H.get('l').split(',') : OVERLAYS.filter(o => o.on).map(o => o.id);
let baseId = H.get('b') || 'ortho', base = null;

function setBase(id) {
  if (base) map.removeLayer(base.layer);
  base = BASES.find(b => b.id === id) || BASES[0];
  base.layer.setZIndex(1).addTo(map);
  baseId = base.id; saveHash();
}
function saveHash() {
  const c = map.getCenter();
  const on = OVERLAYS.filter(o => map.hasLayer(o.layer)).map(o => o.id).join(',');
  history.replaceState(null, '', '#' + new URLSearchParams({ v: [map.getZoom(), c.lat.toFixed(5), c.lng.toFixed(5)].join('/'), b: baseId, l: on }));
}
map.on('moveend', saveHash);

/* ============ LÉGENDE ============ */
// Dans la configuration, une couche peut avoir leg: 'gradient' | 'URL d\'image' | [['#couleur', 'libellé'], ...]
let userLayers = 0;
function legendBody(o) {
  if (o.leg === 'gradient') return '<div class="grad"></div><div class="gl"><span>ombre</span><span>lumière</span></div>';
  if (typeof o.leg === 'string') return `<img src="${o.leg}" alt="" onerror="this.remove()">`;
  if (Array.isArray(o.leg)) return o.leg.map(([c, t]) => `<div><i class="sw" style="background:${c}"></i>${esc(t)}</div>`).join('');
  if (o.gj) return '<div><i class="sw" style="background:#d9480f33;border:2px solid #d9480f;box-sizing:border-box"></i>Entités du fichier</div>';
  return '';
}
function renderLegend() {
  let h = OVERLAYS.filter(o => map.hasLayer(o.layer)).reverse()   // couche du dessus en premier
    .map(o => `<div class="le"><b>${o.n}</b>${legendBody(o)}</div>`).join('');
  if (userLayers) h += '<div class="le"><b>Mes données</b><div><i class="sw" style="background:#d9480f33;border:2px solid #d9480f;box-sizing:border-box"></i>Fichiers GeoJSON importés</div></div>';
  document.getElementById('lgbody').innerHTML = h || '<div class="le">Aucune couche superposée.</div>';
}

/* ============ PANNEAU ============ */
const WARN = '<i class="w" id="w-ID" hidden title="Aucune tuile reçue : zone non couverte par cette couche, ou identifiant de couche à vérifier (GetCapabilities)">⚠</i>';
let html = '<h1>Couches</h1><details open><summary>Fond de carte</summary>';
BASES.forEach(b => html += `<label><input type="radio" name="b" value="${b.id}"> ${b.n} ${WARN.replace('ID', b.id)}</label>`);
html += '</details>';
GROUPS.forEach(g => {
  if (!g.l.length) return;
  html += `<details open><summary>${g.t}</summary>`;
  g.l.forEach(o => {
    html += `<label><input type="checkbox" data-id="${o.id}"> ${o.n} ${WARN.replace('ID', o.id)}</label>` +
      (o.d ? `<small>${o.d}</small>` : '') +
      (o.gj ? '' : `<input type="range" min="0" max="1" step="0.05" value="${o.op ?? 1}" data-op="${o.id}">`);
  });
  html += '</details>';
});
html += '<details open><summary>Mes données locales</summary><input type="file" id="file" accept=".geojson,.json">' +
        '<small>GeoJSON en WGS84 (EPSG:4326). Reste dans votre navigateur. Glisser-déposer possible.</small></details>' +
        '<small style="margin:6px 0 0">Clic sur la carte : altitude (RGE ALTI). Zoom ≥ 15 pour le LiDAR HD.</small>';
const panel = document.getElementById('panel');
panel.innerHTML = html;

function toggle(o, on) {
  if (on) { o.layer.addTo(map); if (o.layer.setZIndex) o.layer.setZIndex(10 + OVERLAYS.indexOf(o)); }
  else map.removeLayer(o.layer);
  renderLegend();
  saveHash();
}
panel.querySelector(`input[name=b][value=${(BASES.find(b => b.id === baseId) || BASES[0]).id}]`).checked = true;
setBase(baseId);
OVERLAYS.forEach(o => {
  const cb = panel.querySelector(`input[data-id=${o.id}]`);
  if (activeOv.includes(o.id)) { cb.checked = true; toggle(o, true); }
  if (o.op != null && o.layer.setOpacity) o.layer.setOpacity(o.op);
});
panel.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'b') setBase(t.value);
  else if (t.dataset.id) toggle(OVERLAYS.find(o => o.id === t.dataset.id), t.checked);
});
panel.addEventListener('input', e => {
  if (e.target.dataset.op) OVERLAYS.find(o => o.id === e.target.dataset.op).layer.setOpacity(+e.target.value);
});
L.DomEvent.disableClickPropagation(panel);
L.DomEvent.disableScrollPropagation(panel);
const lg = document.getElementById('legend');
L.DomEvent.disableClickPropagation(lg);
L.DomEvent.disableScrollPropagation(lg);
renderLegend();

/* ============ DONNÉES LOCALES (GeoJSON) ============ */
function loadFile(f) {
  f.text().then(t => {
    const g = L.geoJSON(JSON.parse(t), gjOpts).addTo(map);
    userLayers++; renderLegend();
    map.fitBounds(g.getBounds());
  }).catch(() => alert('Fichier GeoJSON invalide (attendu : WGS84 / EPSG:4326).'));
}
document.getElementById('file').addEventListener('change', e => e.target.files[0] && loadFile(e.target.files[0]));
const mapEl = document.getElementById('map');
['dragover', 'dragenter'].forEach(ev => mapEl.addEventListener(ev, e => { e.preventDefault(); mapEl.classList.add('drop'); }));
['dragleave', 'drop'].forEach(ev => mapEl.addEventListener(ev, () => mapEl.classList.remove('drop')));
mapEl.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

/* ============ COORDONNÉES & ALTITUDE ============ */
const coords = document.getElementById('coords');
map.on('mousemove', e => coords.textContent = e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5));
map.on('click', e => {
  const { lat, lng } = e.latlng, head = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  const p = L.popup().setLatLng(e.latlng).setContent(head).openOn(map);
  fetch(`https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json?lon=${lng}&lat=${lat}&resource=ign_rge_alti_wld&zonly=false`)
    .then(r => r.json())
    .then(j => { const z = j.elevations[0].z; if (z > -1000) p.setContent(`${head}<br>Altitude (RGE ALTI) : <b>${z.toFixed(1)} m</b>`); })
    .catch(() => {});
});
</script>
</body>
</html>
